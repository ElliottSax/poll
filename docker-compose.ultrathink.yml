version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ultrathink-postgres
    environment:
      POSTGRES_DB: polling_db
      POSTGRES_USER: ultrathink
      POSTGRES_PASSWORD: ultrathink_secure_2024
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - ultrathink-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ultrathink"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ultrathink-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - ultrathink-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Server
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ultrathink-api
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://ultrathink:ultrathink_secure_2024@postgres:5432/polling_db
      REDIS_URL: redis://redis:6379
      PORT: 4000
      ULTRATHINK_MODE: production
      ULTRATHINK_MODEL_TYPE: advanced
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
    ports:
      - "4000:4000"
    networks:
      - ultrathink-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npm run start

  # Web Frontend
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ultrathink-web
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://api:4000
      NEXT_PUBLIC_WS_URL: ws://api:4000
      PORT: 3000
      ULTRATHINK_MODE: production
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
    ports:
      - "3000:3000"
    networks:
      - ultrathink-network
    depends_on:
      - api
    command: npm run start

  # ML Service (Optional)
  ml:
    build:
      context: .
      dockerfile: apps/ml/Dockerfile
    container_name: ultrathink-ml
    environment:
      PYTHON_ENV: production
      MODEL_VERSION: 1.0.0
      API_URL: http://api:4000
      ENABLE_QUANTUM_MODE: true
    volumes:
      - ./apps/ml:/app/apps/ml
      - ml_models:/app/models
    ports:
      - "5000:5000"
    networks:
      - ultrathink-network
    depends_on:
      - api

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: ultrathink-nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - ultrathink-network
    depends_on:
      - web
      - api

networks:
  ultrathink-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  ml_models: