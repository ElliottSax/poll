name: Parallel Development CI

on:
  push:
    branches:
      - 'claude/**'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - '.claude/**'

jobs:
  quick-check:
    name: Quick Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: false

      - name: Type check
        run: npm run type-check
        continue-on-error: false

      - name: Check branch naming convention
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          if [[ ! "$BRANCH_NAME" =~ ^claude/poll-.*-[A-Za-z0-9]+$ ]]; then
            echo "❌ Invalid branch name: $BRANCH_NAME"
            echo "Branch must follow pattern: claude/poll-[feature]-[session-id]"
            echo "Examples:"
            echo "  ✅ claude/poll-api-endpoints-ABC123"
            echo "  ✅ claude/poll-frontend-components-XYZ789"
            exit 1
          fi
          echo "✅ Branch name is valid"

      - name: Check for work assignment updates
        run: |
          if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -q ".claude/WORK_ASSIGNMENTS.md"; then
            echo "✅ Work assignments file has been updated"
          else
            echo "⚠️  Consider updating .claude/WORK_ASSIGNMENTS.md to track your progress"
          fi
        continue-on-error: true

  conflict-check:
    name: Detect Potential Conflicts
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for potential conflicts with main
        run: |
          git fetch origin main
          echo "🔍 Checking for conflicts with main branch..."

          if git merge-tree $(git merge-base HEAD origin/main) HEAD origin/main | grep -q "changed in both"; then
            echo "⚠️  Warning: Potential merge conflicts detected with main"
            echo "Consider syncing your branch with main:"
            echo "  git fetch origin main"
            echo "  git rebase origin/main"
            exit 1
          else
            echo "✅ No conflicts detected with main branch"
          fi
        continue-on-error: true

  build-check:
    name: Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
        continue-on-error: false

      - name: Build success notification
        if: success()
        run: |
          echo "✅ Build successful!"
          echo "Your changes are ready for review."

  parallel-dev-summary:
    name: Development Summary
    runs-on: ubuntu-latest
    needs: [quick-check, build-check]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate summary
        run: |
          echo "# 🚀 Parallel Development CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Status" >> $GITHUB_STEP_SUMMARY
          echo "- Quick Check: ${{ needs.quick-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build Check: ${{ needs.build-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Review the checks above" >> $GITHUB_STEP_SUMMARY
          echo "2. Update \`.claude/WORK_ASSIGNMENTS.md\` with your progress" >> $GITHUB_STEP_SUMMARY
          echo "3. Continue development or open a PR when ready" >> $GITHUB_STEP_SUMMARY
